name: Build installers

# Compile Pod Téléverseur et fabrique les livrables D'INSTALLATION SEULEMENT
# (plus de version portable, depuis la mise à jour du 2.2.x) :
#   • PodTeleverseur-Windows-Setup.exe — installeur Inno Setup
#   • PodTeleverseur-macOS.dmg         — image disque
#
# Chaque nom de fichier PUBLIÉ porte explicitement son OS, pour qu'une personne
# qui télécharge depuis la page de Release ne puisse pas se tromper.
#
# Déclencheurs :
#   • Bouton "Run workflow" dans l'onglet Actions (build manuel)
#   • Push d'un tag v* (ex : v1.0.0) → crée automatiquement une Release GitHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Écrire OUI pour PUBLIER une version (le numéro est lu dans __version__.py). Laisser VIDE = compilation d'essai."
        required: false
        default: ""
      notes:
        description: "Phrase affichée dans le bandeau de mise à jour (facultatif)"
        required: false
        default: ""
      obligatoire:
        description: >-
          Rendre cette mise à jour OBLIGATOIRE : les postes en version
          antérieure afficheront une fenêtre bloquante (aucun bandeau) tant
          qu'ils n'ont pas mis à jour. Réservé aux cas où continuer serait
          dangereux (ex. rotation du mot de passe du compte véhicule) — voir
          maj.py. Laisser décoché pour une publication normale.
        required: false
        type: boolean
        default: false
      version_minimale:
        description: >-
          Version en dessous de laquelle l'application est considérée
          périmée (ex. 2.5.0). Si "obligatoire" est coché et ce champ laissé
          vide, la version publiée elle-même sert de seuil : TOUT poste non à
          jour sera alors bloqué.
        required: false
        default: ""

jobs:
  # ─────────────────────────────── WINDOWS ───────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Étape 1 : PyInstaller → PodTeleverseur.exe
      - name: Compiler PodTeleverseur.exe (PyInstaller)
        run: |
          pyinstaller --onefile --windowed --name "PodTeleverseur" `
            --icon "assets/icon.ico" `
            --version-file version.txt `
            --collect-all customtkinter `
            --collect-all keyring `
            --collect-all tkinterdnd2 `
            --add-data "assets;assets" `
            app.py

      # Étape 2 : Inno Setup → PodTeleverseur-Setup.exe
      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Fabriquer l'installeur Windows (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\installer.iss"

      # Publication des deux livrables Windows comme artefacts du run
      # Seul l'INSTALLEUR est conservé : la Release ne propose plus de version
      # portable. Renommé ici, PENDANT la compilation, pour que « Windows »
      # figure dans le nom du FICHIER lui-même — c'est ce nom que verra la
      # personne qui télécharge, et c'est lui qui doit être sans ambiguïté.
      # Le préfixer dans le libellé de l'artefact GitHub n'aurait pas suffi :
      # ce libellé n'apparaît nulle part sur la page de téléchargement finale.
      - name: Renommer l'installeur avec le nom d'OS explicite
        run: |
          Rename-Item "installer_output\PodTeleverseur-Setup.exe" `
            "PodTeleverseur-Windows-Setup.exe"

      - name: Publier PodTeleverseur-Windows-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: PodTeleverseur-Windows-Setup
          path: installer_output/PodTeleverseur-Windows-Setup.exe

  # ──────────────────────────────── macOS ────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Fabrication de l'icône .icns macOS depuis le master PNG 1024×1024
      # (sips + iconutil sont des outils natifs macOS, disponibles sur les runners)
      - name: Fabriquer l'icône macOS (.icns)
        run: |
          mkdir -p icon.iconset
          sips -z 16   16   assets/icon_master.png --out icon.iconset/icon_16x16.png
          sips -z 32   32   assets/icon_master.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32   32   assets/icon_master.png --out icon.iconset/icon_32x32.png
          sips -z 64   64   assets/icon_master.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128  128  assets/icon_master.png --out icon.iconset/icon_128x128.png
          sips -z 256  256  assets/icon_master.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256  256  assets/icon_master.png --out icon.iconset/icon_256x256.png
          sips -z 512  512  assets/icon_master.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512  512  assets/icon_master.png --out icon.iconset/icon_512x512.png
          cp assets/icon_master.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o assets/icon.icns

      # Étape 1 : PyInstaller → PodTeleverseur.app
      - name: Compiler PodTeleverseur.app (PyInstaller)
        run: |
          pyinstaller --onefile --windowed --name "PodTeleverseur" \
            --icon "assets/icon.icns" \
            --collect-all customtkinter \
            --collect-all keyring \
            --collect-all tkinterdnd2 \
            --add-data "assets:assets" \
            app.py

      # Sur Apple Silicon, macOS EXIGE que tout exécutable porte une signature
      # valide. Sans elle, le système refuse l'application avec le message
      # trompeur « est endommagé et ne peut pas être ouvert » — alors que le
      # fichier est intact. Une signature « ad hoc » (-s -) suffit à lever ce
      # blocage : elle ne certifie pas l'éditeur (il faudrait un compte Apple
      # Developer payant), mais elle rend le paquet cohérent.
      - name: Signer l'application (signature ad hoc)
        run: |
          codesign --force --deep --sign - "dist/PodTeleverseur.app"
          codesign --verify --deep --strict --verbose=2 "dist/PodTeleverseur.app"

      # Étape 2 : DMG (image disque avec raccourci vers /Applications)
      - name: Fabriquer le DMG macOS
        run: |
          mkdir -p dmg_stage
          # `ditto` préserve la signature et les liens internes du paquet,
          # ce que `cp -R` ne garantit pas.
          ditto "dist/PodTeleverseur.app" "dmg_stage/PodTeleverseur.app"
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Pod Televerseur" -srcfolder dmg_stage \
            -ov -format UDZO "dist/PodTeleverseur.dmg"

      # Étape 3 : ZIP de l'app (livrable historique conservé pour compatibilité)
      - name: Compresser l'app en ZIP
        run: |
          cd dist
      # Le .zip de l'archive .app n'est PLUS FABRIQUÉ : il n'est plus publié
      # depuis la 2.2.x, et le construire pour rien allongerait le build sans
      # raison. (Le piège `ditto` vs `zip` sur un .app reste vrai le jour où
      # ce livrable reviendrait — ne pas utiliser `zip`, qui casse la
      # signature et fait réapparaître « est endommagé ».)

      # Publication du livrable macOS comme artefact du run
      # Seul le .dmg est conservé : c'est l'équivalent macOS de l'installeur
      # Windows. Renommé pour porter « macOS » dans le nom du fichier, comme
      # pour Windows ci-dessus.
      - name: Renommer le .dmg avec le nom d'OS explicite
        run: |
          mv dist/PodTeleverseur.dmg dist/PodTeleverseur-macOS.dmg

      - name: Publier PodTeleverseur-macOS.dmg
        uses: actions/upload-artifact@v4
        with:
          name: PodTeleverseur-macOS-DMG
          path: dist/PodTeleverseur-macOS.dmg

  # ──────────────────── Release GitHub (uniquement sur tag v*) ───────────
  # Les 4 livrables sont joints à la Release : installeurs + portables.
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # Publication sur tag v*, OU sur « Run workflow » avec le champ version
    # rempli. Champ vide = compilation d'essai, rien n'est publié.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    # Le jeton automatique de GitHub Actions est en LECTURE SEULE par défaut :
    # sans cette autorisation, la création de la Release échoue en 403.
    permissions:
      contents: write
    steps:
      # ORDRE IMPORTANT : le checkout d'abord, car il NETTOIE le dossier de
      # travail. Placé après, il supprimerait les artefacts téléchargés.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      # Le numéro vient du CODE (__version__.py), jamais du formulaire : sinon
      # l'application pourrait s'annoncer dans une version et en afficher une
      # autre, et signaler en permanence une mise à jour… vers elle-même.
      - name: Déterminer le numéro de version (depuis le code)
        id: v
        shell: bash
        run: |
          NUM=$(grep -oE '__version__[[:space:]]*=[[:space:]]*"[^"]+"' __version__.py | grep -oE '"[^"]+"' | tr -d '"')
          if [ -z "$NUM" ]; then
            echo "::error::Impossible de lire la version dans __version__.py"
            exit 1
          fi
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "Version publiée (lue dans le code) : $NUM"

      # La Release est publiée sur le dépôt PUBLIC, et non sur ce dépôt privé :
      # le bouton « Télécharger » du bandeau renvoie vers lui. Publier ici
      # donnerait une page inaccessible (404) à tout enseignant.
      #
      # L'écriture se fait avec RELEASES_TOKEN : le jeton automatique de
      # GitHub Actions n'a aucun droit en dehors de ce dépôt-ci.
      - name: Créer la release sur le dépôt public
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASES_REPO || format('{0}/podteleverseur-releases', github.repository_owner) }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.v.outputs.num }}
          name: Pod Téléverseur v${{ steps.v.outputs.num }}
          body: ${{ inputs.notes || 'Nouvelle version.' }}
          # Uniquement les fichiers d'INSTALLATION : plus de version portable
          # dans la Release. Chaque nom de fichier porte explicitement son OS,
          # pour qu'une personne qui télécharge ne puisse pas se tromper.
          files: |
            PodTeleverseur-Windows-Setup/PodTeleverseur-Windows-Setup.exe
            PodTeleverseur-macOS-DMG/PodTeleverseur-macOS.dmg

      # ── Notification de mise à jour ────────────────────────────────────
      # Écrit `version.json` sur le dépôt PUBLIC. C'est ce fichier que les
      # applications installées consultent au démarrage.
      #
      # Sans le secret RELEASES_TOKEN, l'étape est IGNORÉE : la compilation se
      # déroule normalement, seule la notification n'est pas publiée.
      - name: Publier version.json sur le dépôt public
        if: env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DEPOT_PUBLIC: ${{ vars.RELEASES_REPO }}
        run: |
          set -e
          VERSION="${{ steps.v.outputs.num }}"
          DEPOT="${DEPOT_PUBLIC:-${GITHUB_REPOSITORY_OWNER}/podteleverseur-releases}"
          NOTES="${{ inputs.notes }}"
          [ -z "$NOTES" ] && NOTES="Nouvelle version disponible."

          # ⚠️ CORRECTIF : ces deux champs du formulaire (workflow_dispatch,
          # voir plus haut) n'étaient JUSQU'ICI jamais transmis au fichier
          # final — "obligatoire" n'était même pas écrit, et
          # "version_minimale" restait figé à "" quel que soit le formulaire.
          # Un utilisateur cochant "obligatoire" publiait donc, sans le
          # savoir, une mise à jour parfaitement NORMALE : aucun blocage ne
          # pouvait jamais se produire.
          OBLIGATOIRE="${{ inputs.obligatoire }}"
          [ -z "$OBLIGATOIRE" ] && OBLIGATOIRE="false"

          MINIMALE="${{ inputs.version_minimale }}"
          # Règle documentée dans MISE_EN_PLACE_MISES_A_JOUR.md : si
          # "obligatoire" est coché et qu'aucun seuil n'est précisé, la
          # version publiée elle-même sert de seuil — TOUT poste non encore
          # sur cette version est alors bloqué.
          if [ "$OBLIGATOIRE" = "true" ] && [ -z "$MINIMALE" ]; then
            MINIMALE="$VERSION"
          fi

          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/$DEPOT/releases/latest",
            "notes": "$NOTES",
            "version_minimale": "$MINIMALE",
            "obligatoire": $OBLIGATOIRE
          }
          EOF
          echo "Contenu publié :" && cat version.json

          git clone --depth 1 \
            "https://x-access-token:${RELEASES_TOKEN}@github.com/${DEPOT}.git" public
          cp version.json public/version.json
          cd public
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add version.json
          git diff --cached --quiet || git commit -m "Version $VERSION"
          git push
